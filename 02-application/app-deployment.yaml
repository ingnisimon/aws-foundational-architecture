apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundational-app
  namespace: default
  labels:
    app: foundational-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foundational-app
  template:
    metadata:
      labels:
        app: foundational-app
    spec:
      serviceAccountName: foundational-app-sa
      containers:
      - name: web
        image: 384518871764.dkr.ecr.us-east-1.amazonaws.com/foundational-architecture-app-repo:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: DB_HOST
          value: "foundational-architecture-db.cavcmkkasnrb.us-east-1.rds.amazonaws.com"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "SuperSecretPassword123!"
        - name: DB_NAME
          value: "appdb"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: foundational-app-service
  namespace: default
  labels:
    app: foundational-app
spec:
  type: LoadBalancer
  selector:
    app: foundational-app
  ports:
  - port: 80
    targetPort: 80
