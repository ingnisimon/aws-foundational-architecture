apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: "foundational-architecture-karpenter-node-role"
  subnetSelectorTerms:
    - tags:
        Name: "foundational-architecture-private-subnet-*"
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: "foundational-architecture-cluster"
  tags:
    Name: "foundational-architecture-karpenter-node"
    Environment: "dev"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.small", "t8i.small", "c7i-flex.large", "m7i-flex.large"]
  limits:
    cpu: 10
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
